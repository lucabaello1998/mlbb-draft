# Actualiza el dataset una vez por mes: roster nuevo desde la wiki, tiers de las
# fuentes y atributos oficiales. Si algo no cierra, `check.mjs` falla y no commitea.
name: Actualizar datos

on:
  schedule:
    - cron: "0 6 1 * *" # día 1 de cada mes, 06:00 UTC
  workflow_dispatch:

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Roster desde la wiki
        run: node scripts/importar-heroes.mjs

      - name: Tiers de las fuentes
        run: node scripts/importar-tiers.mjs

      - name: Atributos oficiales
        run: node scripts/importar-atributos.mjs

      - name: Tips de los héroes sin curar
        run: node scripts/generar-tips.mjs

      - name: Retratos de respaldo
        run: node scripts/generar-arte.mjs

      - name: Validar el dataset
        run: node scripts/check.mjs

      - name: Commit si hubo cambios
        run: |
          if [ -z "$(git status --porcelain data assets)" ]; then
            echo "Sin cambios en el dataset."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          git commit -m "datos: actualización mensual (roster, tiers y atributos)"
          git push
